name: Update LoL Stats

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch LoL Stats & Update README
        run: |
          python3 -c "
          import requests

          # API publique alternative pour récupérer les données OP.GG
          name = 'Sollipitie'
          tag = 'TDB'
          url = f'https://lol-api-sum.graphtree.workers.dev/api/summoner/euw/{name}-{tag}'
          
          rank_display = 'Diamond'
          wr_display = '54%'
          games_display = 'W | W | L'

          try:
              res = requests.get(url, timeout=10)
              if res.status_code == 200:
                  data = res.json()
                  tier = data.get('tier', 'Diamond')
                  rank_num = data.get('rank', '')
                  wins = data.get('wins', 0)
                  losses = data.get('losses', 0)
                  total = wins + losses
                  
                  if total > 0:
                      wr = round((wins / total) * 100)
                      wr_display = f'{wr}%25%20({wins}W%20{losses}L)'
                  rank_display = f'{tier}%20{rank_num}'.strip()
          except Exception as e:
              print('API error, using fallbacks:', e)

          html = f'''<table>
            <tr>
              <td align=\"center\" width=\"50%\">
                <b>Progression Ranked</b><br/><br/>
                <a href=\"https://www.op.gg/summoners/euw/Sollipitie-TDB\">
                  <img src=\"https://img.shields.io/badge/Rank-{rank_display}-blue?style=for-the-badge&logo=leagueoflegends\" alt=\"Rank\" />
                </a>
              </td>
              <td align=\"center\" width=\"50%\">
                <b>Winrate (WR)</b><br/><br/>
                <a href=\"https://www.op.gg/summoners/euw/Sollipitie-TDB\">
                  <img src=\"https://img.shields.io/badge/Winrate-{wr_display}-success?style=for-the-badge\" alt=\"Winrate\" />
                </a>
              </td>
            </tr>
            <tr>
              <td align=\"center\" width=\"50%\">
                <b>Dernières Parties</b><br/><br/>
                <img src=\"https://img.shields.io/badge/Recent-W%20|%20W%20|%20L-brightgreen?style=for-the-badge\" alt=\"3 Last Games\" />
              </td>
              <td align=\"center\" width=\"50%\">
                <b>Compte Riot</b><br/><br/>
                <a href=\"https://www.op.gg/summoners/euw/Sollipitie-TDB\">
                  <img src=\"https://img.shields.io/badge/Riot%20ID-Sollipitie%23TDB-orange?style=for-the-badge\" alt=\"Riot ID\" />
                </a>
              </td>
            </tr>
          </table>'''

          with open('README.md', 'r') as f:
              content = f.read()

          start = '<!--LOL-STATS-START-->'
          end = '<!--LOL-STATS-END-->'
          if start in content and end in content:
              new_content = content.split(start)[0] + start + '\n' + html + '\n' + end + content.split(end)[1]
              with open('README.md', 'w') as f:
                  f.write(new_content)
          "

      - name: Commit & Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md
          git diff-index --quiet HEAD || git commit -m "auto: update LoL stats grid"
          git push
