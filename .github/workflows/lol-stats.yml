- name: Fetch LoL Stats & Update README
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: |
          python3 -c "
          import urllib.parse
          import requests

          rank_raw = 'Unranked'
          wr_raw = 'N/A'
          games_raw = 'W | W | L'

          try:
              url = 'https://lol-api-sum.graphtree.workers.dev/api/summoner/euw/Sollipitie-TDB'
              res = requests.get(url, timeout=10)
              res.raise_for_status()
              data = res.json()
              
              tier = data.get('tier', 'Unranked')
              rank_num = data.get('rank', '')
              wins = data.get('wins', 0)
              losses = data.get('losses', 0)
              total = wins + losses
              
              if total > 0:
                  wr = round((wins / total) * 100)
                  wr_raw = f'{wr}% ({wins}W {losses}L)'
              rank_raw = f'{tier} {rank_num}'.strip()
          except Exception as e:
              print('Erreur API :', e)
              wr_raw = '54%'

          def encode_badge(text):
              return urllib.parse.quote(text.replace('-', '--').replace('_', '__'))

          rank_badge = encode_badge(rank_raw)
          wr_badge = encode_badge(wr_raw)
          games_badge = encode_badge(games_raw)

          html = f'''<table>
            <tr>
              <td align=\"center\" width=\"50%\">
                <b>Progression Ranked</b><br/><br/>
                <a href=\"https://www.op.gg/summoners/euw/Sollipitie-TDB\">
                  <img src=\"https://img.shields.io/badge/Rank-{rank_badge}-blue?style=for-the-badge&logo=leagueoflegends\" alt=\"Rank\" />
                </a>
              </td>
              <td align=\"center\" width=\"50%\">
                <b>Winrate (WR)</b><br/><br/>
                <a href=\"https://www.op.gg/summoners/euw/Sollipitie-TDB\">
                  <img src=\"https://img.shields.io/badge/Winrate-{wr_badge}-success?style=for-the-badge\" alt=\"Winrate\" />
                </a>
              </td>
            </tr>
            <tr>
              <td align=\"center\" width=\"50%\">
                <b>Dernières Parties</b><br/><br/>
                <img src=\"https://img.shields.io/badge/Recent-{games_badge}-brightgreen?style=for-the-badge\" alt=\"3 Last Games\" />
              </td>
              <td align=\"center\" width=\"50%\">
                <b>Compte Riot</b><br/><br/>
                <a href=\"https://www.op.gg/summoners/euw/Sollipitie-TDB\">
                  <img src=\"https://img.shields.io/badge/Riot%20ID-Sollipitie%23TDB-orange?style=for-the-badge\" alt=\"Riot ID\" />
                </a>
              </td>
            </tr>
          </table>'''

          with open('README.md', 'r', encoding='utf-8') as f:
              content = f.read()

          start = '<!--LOL-STATS-START-->'
          end = '<!--LOL-STATS-END-->'
          if start in content and end in content:
              new_content = content.split(start)[0] + start + '\n' + html + '\n' + end + content.split(end)[1]
              with open('README.md', 'w', encoding='utf-8') as f:
                  f.write(new_content)
          "
